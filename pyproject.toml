[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "identifiability-guard"
version = "0.1.0"
description = "A framework for evaluating identifiability metrics in representation learning"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Shruti Joshi"},
    {name = "Théo Saulus"},
    {name = "Wieland Brendel"},
    {name = "Philippe Brouillard"},
    {name = "Dhanya Sridhar"},
    {name = "Patrik Reizinger"},
]
keywords = ["identifiability", "representation learning", "disentanglement", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.0.1",
    "matplotlib>=3.5.0",
]

[project.urls]
Paper = "https://proceedings.mlr.press/v337/joshi26a.html"
Repository = "https://github.com/shrutij01/identifiability-guard"
Documentation = "https://shrutij01.github.io/identifiability-guard/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.10.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["identifiability_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
